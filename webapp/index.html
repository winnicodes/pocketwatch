<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e0f11" />
  <title>pocketwatch</title>
  <!-- SVG-Favicon reicht fuer alle aktuellen Browser; das PNG existiert nur,
       weil iOS bei apple-touch-icon kein SVG akzeptiert und sonst einen
       Screenshot der Seite auf den Homescreen legt. -->
  <link rel="icon" href="/pocketwatch.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-512.png" />
  <!-- .json statt .webmanifest: nginx kennt die Endung .webmanifest nicht und
       wuerde application/octet-stream ausliefern. -->
  <link rel="manifest" href="/manifest.json" />
</head>
<body class="bg-darker text-light">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
