server {
    listen 80;
    root /var/www/html;
    index index.html;

    gzip on;
    gzip_types application/javascript text/css application/json;

    # times.json is written as a whole; the 1m default fails at ~6000 entries.
    client_max_body_size 16m;

    # data/ is inside the webroot; only the API may read it.
    location ^~ /data {
        return 404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
