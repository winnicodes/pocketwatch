server {
    listen 80;
    root /var/www/html;
    index index.html;

    gzip on;
    gzip_types application/javascript text/css application/json;

    # times.json wird immer als Ganzes geschrieben. Mit dem nginx-Default von 1m
    # kippt das Speichern ab etwa 6000 Eintraegen in ein 413 - der Client sieht
    # dann nur noch einen Konsolenfehler und speichert still nicht mehr.
    client_max_body_size 16m;

    # data/ liegt im Webroot - ohne diese Sperre waere times.json direkt abrufbar
    # und die Whitelist in read.php wirkungslos.
    location ^~ /data {
        return 404;
    }

    # PHP API (z.B. /api/read.php, /api/write.php)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
    }

    # Fehlende Assets sollen 404 liefern statt index.html mit Status 200.
    location /assets/ {
        try_files $uri =404;
    }

    # React-Router / SPA Fallback
    location / {
        try_files $uri /index.html;
    }
}
